{% extends 'master.html' %}
{% block title %}Delete{% endblock %}
{% block heading %}Delete: {{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px"><div class="card-body">
  <p>Are you sure you want to delete <strong>{{ obj }}</strong>?</p>
  <form method="post">{% csrf_token %}
    <a href="{% url 'crud_index' key %}" class="btn btn-outline-secondary">Cancel</a>
    <button class="btn btn-danger">Yes, delete</button>
  </form>
</div></div>
{% endblock %}
